[project]
name = "airflow-pod-exec-duckdb-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apache-airflow==3.4.0",
    "apache-airflow-providers-cncf-kubernetes==11.0.0",
    # ExecutionMode.KUBERNETES_EXEC is not released yet: pinned to the head of
    # https://github.com/astronomer/astronomer-cosmos/pull/3027
    "astronomer-cosmos[kubernetes] @ git+https://github.com/AlejandroMorgante/astronomer-cosmos@2194b9ff12e442a73d7cf4b02529c071ccdae26f",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "azure-identity>=1.19",
    "azure-mgmt-containerservice>=34",
]

[tool.uv]
package = false

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["include"]
testpaths = ["tests"]
