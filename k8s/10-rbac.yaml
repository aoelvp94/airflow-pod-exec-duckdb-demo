# Least-privilege identity Airflow uses to exec into the long-lived pod.
# On AKS this would be the Entra identity / workload identity bound to the same Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-exec
  namespace: duckdb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec
  namespace: duckdb
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Websocket exec is authorised as "get" on older clusters and "create" on newer ones: grant both.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-exec
  namespace: duckdb
subjects:
  - kind: ServiceAccount
    name: airflow-exec
    namespace: duckdb
roleRef:
  kind: Role
  name: pod-exec
  apiGroup: rbac.authorization.k8s.io
