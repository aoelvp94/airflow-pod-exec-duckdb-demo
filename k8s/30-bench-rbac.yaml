# Benchmark only: a second identity allowed to LAUNCH pods (what KubernetesPodOperator needs),
# kept separate so `airflow-exec` stays exec-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-launcher
  namespace: duckdb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-launcher
  namespace: duckdb
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-launcher
  namespace: duckdb
subjects:
  - kind: ServiceAccount
    name: airflow-launcher
    namespace: duckdb
roleRef:
  kind: Role
  name: pod-launcher
  apiGroup: rbac.authorization.k8s.io
